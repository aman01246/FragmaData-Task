spring.application.name=OAuth-project


spring.datasource.url=jdbc:mysql://localhost:3306/oauth_db
spring.datasource.username=root
spring.datasource.password=aman

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.config.import=optional:classpath:secret.yml


#Google
spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
 
#Aws
spring.security.oauth2.client.registration.aws.provider=aws-cognito
spring.security.oauth2.client.registration.aws.client-id=${aws.client-id}
spring.security.oauth2.client.registration.aws.client-secret=${aws.client-secret}
spring.security.oauth2.client.registration.aws.scope=openid,profile,email
spring.security.oauth2.client.registration.aws.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.aws.redirect-uri=http://localhost:8080/login/oauth2/code/aws

# AWS Cognito Provider

spring.security.oauth2.client.provider.aws-cognito.issuer-uri=https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_2QwUFtOqa


