<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Complete Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .google-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .google-info img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        .google-info p {
            margin: 8px 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #4285f4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }

    </style>

</head>

<body>

<div class="register-container">

    <h2>Complete Your Registration</h2>


    <!-- Google Information -->

    <div class="google-info">

        <img th:src="${userInfo.picture}"
             alt="Profile Picture">

        <p>
            <strong th:text="${userInfo.name}">
                User Name
            </strong>
        </p>

        <p th:text="${userInfo.email}">
            user@gmail.com
        </p>

    </div>


    <!-- Registration Form -->

    <form th:action="@{/register}"
          method="post">


        <!-- Phone -->

        <label for="phone">
            Phone Number
        </label>

        <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
        >


        <!-- Department -->

        <label for="department">
            Department
        </label>

        <input
                type="text"
                id="department"
                name="department"
                placeholder="Enter department"
                required
        >


        <!-- Designation -->

        <label for="designation">
            Designation
        </label>

        <input
                type="text"
                id="designation"
                name="designation"
                placeholder="Enter designation"
                required
        >


        <button type="submit">
            Complete Registration
        </button>

    </form>

</div>

</body>

</html>
