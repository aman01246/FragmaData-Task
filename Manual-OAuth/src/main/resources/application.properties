spring.application.name=Manual-OAuth

spring.datasource.url=jdbc:mysql://localhost:3306/oauth_db
spring.datasource.username=root
spring.datasource.password=aman

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.config.import=optional:classpath:secret.yml

# Google OAuth
google.client-id=${google.client-id}
google.client-secret=${google.client-secret}
google.redirect-uri=http://localhost:8080/oauth/google/callback