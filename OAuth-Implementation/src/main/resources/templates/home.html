<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Google OAuth Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:400px;
    padding:40px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    color:#333;
    margin-bottom:15px;
}

p{
    color:#666;
    margin-bottom:30px;
}

a{
    display:inline-block;
    text-decoration:none;
    background:#4285F4;
    color:white;
    padding:12px 24px;
    border-radius:5px;
    font-size:16px;
    transition:.3s;
}

a:hover{
    background:#2d6cdf;
}

</style>

</head>

<body>

<div class="container">

    <h1>Google OAuth Demo</h1>

    <p>Sign in using your Google account</p>

    <a href="/oauth2/authorization/google">
        Login with Google
    </a>

</div>

</body>
</html>
